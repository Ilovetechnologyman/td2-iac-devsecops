---
# Préparation du système avant l'installation de K3s.
# Toutes les tâches sont idempotentes.

- name: Désactiver systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Écrire un fichier resolv.conf statique
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 1.1.1.1
      nameserver 8.8.8.8
    mode: "0644"
  become: true

- name: Ajouter l'entrée locale dans /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present
  become: true

- name: Mettre à jour le cache apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Installer les paquets prérequis
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - netcat-openbsd
    state: present
  become: true

- name: Vérifier que get.k3s.io est résolvable
  ansible.builtin.command:
    cmd: getent ahostsv4 get.k3s.io
  register: dns_check
  changed_when: false
  failed_when: dns_check.rc != 0
